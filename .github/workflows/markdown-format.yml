---
name: Markdown format
on:
  push:
    branches:
      - agent/add-markdown-lint-qa
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Format generated Markdown
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path(".cursor/skills/speckit-clarify/SKILL.md"),
              Path(".github/agents/speckit.clarify.agent.md"),
              Path(".opencode/commands/speckit.clarify.md"),
              Path("skills/speckit-clarify/SKILL.md"),
          )
          for path in paths:
              lines = path.read_text().splitlines()
              if any("markdownlint-disable MD058" in line for line in lines):
                  continue
              for start, line in enumerate(lines):
                  if "| Option | Description" not in line:
                      continue
                  indent = line[: len(line) - len(line.lstrip())]
                  end = start
                  while end + 1 < len(lines) and lines[end + 1].lstrip().startswith("|"):
                      end += 1
                  lines.insert(start, f"{indent}<!-- markdownlint-disable MD058 -->")
                  lines.insert(end + 2, f"{indent}<!-- markdownlint-enable MD058 -->")
                  break
              path.write_text("\n".join(lines) + "\n")
          PY
          npx -y prettier@3.9.6 --write \
            .cursor/skills/speckit-clarify/SKILL.md \
            .github/agents/speckit.clarify.agent.md \
            .opencode/commands/speckit.clarify.md \
            skills/speckit-clarify/SKILL.md
          config_file="${RUNNER_TEMP}/markdownlint-cli2.jsonc"
          printf '{"config":{"MD013":false,"MD033":false,"MD041":false}}' > "${config_file}"
          git ls-files -z -- '*.md' '*.markdown' \
            | xargs -0 -r npx -y markdownlint-cli2@0.23.2 --config "${config_file}" --
      - name: Commit formatting
        run: |
          if [[ -z "$(git status --porcelain -- '*.md')" ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .cursor/skills/speckit-clarify/SKILL.md \
            .github/agents/speckit.clarify.agent.md \
            .opencode/commands/speckit.clarify.md \
            skills/speckit-clarify/SKILL.md
          git commit -m 'Format generated Markdown'
          git push
