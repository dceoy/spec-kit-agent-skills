---
name: Markdown repair
on:
  push:
    branches:
      - agent/add-markdown-lint-qa
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Repair Markdown
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.md", "*.markdown"]
          ).decode().split("\0")
          for name in filter(None, paths):
              path = Path(name)
              if path.is_symlink():
                  continue
              lines = path.read_text().splitlines()
              in_fence = False
              for i, line in enumerate(lines):
                  bare = re.fullmatch(r"(\s*)```\s*", line)
                  if bare:
                      if in_fence:
                          in_fence = False
                      else:
                          lines[i] = f"{bare.group(1)}```text"
                          in_fence = True
                      continue
                  if re.match(r"^\s*```\S", line):
                      in_fence = True
              if not any("markdownlint-disable MD058" in line for line in lines):
                  for start, line in enumerate(lines):
                      if "| Option | Description" not in line:
                          continue
                      indent = line[: len(line) - len(line.lstrip())]
                      end = start
                      while end + 1 < len(lines) and lines[end + 1].lstrip().startswith("|"):
                          end += 1
                      lines.insert(start, f"{indent}<!-- markdownlint-disable MD058 -->")
                      lines.insert(end + 2, f"{indent}<!-- markdownlint-enable MD058 -->")
                      break
              path.write_text("\n".join(lines) + "\n")
          PY
          config_file="${RUNNER_TEMP}/markdownlint-cli2.jsonc"
          printf '{"config":{"MD013":false,"MD033":false,"MD041":false}}' > "${config_file}"
          set +e
          git ls-files -z -- '*.md' '*.markdown' \
            | xargs -0 -r npx -y markdownlint-cli2 --fix --config "${config_file}" --
          set -e
          npx -y prettier --write './**/*.{md,markdown}'
          git ls-files -z -- '*.md' '*.markdown' \
            | xargs -0 -r npx -y markdownlint-cli2 --config "${config_file}" --
      - name: Commit repairs
        run: |
          if [[ -z "$(git status --porcelain -- '*.md' '*.markdown')" ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix generated Markdown lint issues'
          git push
